name = "ledger-backup"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 03:00 America/New_York. Cron is UTC, so this is 07:00 UTC — an hour off in
# winter, which does not matter for a nightly job.
[triggers]
crons = ["0 7 * * *"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "ledger-backups"

[vars]
SUPABASE_URL = "https://hbjguunjdqiuaukpioyu.supabase.co"

# Secrets — set with `wrangler secret put NAME`, never in this file:
#   SUPABASE_SERVICE_KEY   reads every row, bypassing RLS
#   BACKUP_PUBLIC_KEY      ledger-pk-… (public; only encrypts, cannot decrypt)
#   ALERT_WEBHOOK          optional
