[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ledger-media"

[vars]
SUPABASE_URL = "https://hbjguunjdqiuaukpioyu.supabase.co"
# Lock this to your Pages URL once it's stable. "*" is fine while testing —
# authorization is enforced by the token check, not by CORS.
# ALLOWED_ORIGIN = "https://trading-journal-1-0.pages.dev"

# Secret — set with `wrangler secret put SUPABASE_ANON_KEY`.
